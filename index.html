    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 1. Cole a URL do seu App da Web do Google Apps Script abaixo:
        const scriptURL = "https://script.google.com/macros/s/AKfycbycqGyM96Fl5CgbylZ63CzBtw3ux4BAb-1j8APlc7A_Hm53CPx5279Fx2X-akpLzOxF4A/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const gclid = urlParams.get("gclid");

        // Só ativa se o visitante veio de um anúncio pago com GCLID
        if (gclid) {
          // Gera um número de protocolo curto de 4 dígitos (ex: #4821)
          const protocolo = "#" + Math.floor(1000 + Math.random() * 9000);
          const whatsappLinks = document.querySelectorAll(
            'a[href*="wa.me"], a[href*="://whatsapp.com"]',
          );

          whatsappLinks.forEach(function (link) {
            try {
              // Formata o link do WhatsApp com o Protocolo no início
              const url = new URL(link.href);
              const mensagemAtual =
                url.searchParams.get("text") ||
                "Olá! Gostaria de agendar uma consulta sobre meu benefício previdenciário.";
              const novaMensagem =
                "Protocolo " + protocolo + " - " + mensagemAtual;

              url.searchParams.set("text", novaMensagem);
              link.href = url.toString();

              // Envia os dados para a planilha no exato segundo em que o cliente clica
              link.addEventListener("click", function () {
                fetch(scriptURL, {
                  method: "POST",
                  mode: "no-cors",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    protocolo: protocolo,
                    gclid: gclid,
                  }),
                });
              });
            } catch (e) {
              console.error("Erro ao configurar rastreamento do WhatsApp:", e);
            }
          });
        }
      });
    </script>
